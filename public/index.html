<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drop Monitor</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #0d0f14; --panel: #151922; --panel2: #1c212d; --border: #262c3a;
    --text: #e6e9ef; --muted: #8b93a7; --accent: #7c5cff; --green: #3ecf8e;
    --yellow: #f5c451; --red: #ef5b5b; --blue: #5b8cff; --pink: #e85bb5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 24px; border-bottom: 1px solid var(--border); background: var(--panel); }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .3px; }
  header h1 span { color: var(--accent); }
  .stats { display: flex; gap: 20px; margin-left: auto; color: var(--muted); font-size: 13px; }
  .stats b { color: var(--text); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--red); margin-right: 6px; }
  .dot.on { background: var(--green); }
  main { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(320px, 1fr); gap: 20px; padding: 20px 24px; }
  @media (max-width: 960px) { main { grid-template-columns: 1fr; padding: 16px; } .stats { display: none; } }
  section { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
  section h2 .grow { flex: 1; }
  form { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; padding: 16px; }
  form .wide { grid-column: 1 / -1; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  input, select { background: var(--panel2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 8px 10px; font: inherit; min-width: 0; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 7px 12px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger:hover { border-color: var(--red); color: var(--red); }
  button.small { padding: 4px 9px; font-size: 12px; }
  .row-actions { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { font-size: 12px; color: var(--muted); font-weight: 500; }
  tr:last-child td { border-bottom: 0; }
  .sub { color: var(--muted); font-size: 12px; word-break: break-all; }
  .pill { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--panel2); border: 1px solid var(--border); white-space: nowrap; }
  .pill.ok { color: var(--green); } .pill.err { color: var(--red); } .pill.off { color: var(--muted); } .pill.run { color: var(--yellow); }
  .feed { max-height: calc(100vh - 140px); overflow-y: auto; }
  .ev { display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .ev img { width: 48px; height: 48px; object-fit: cover; border-radius: 6px; background: var(--panel2); flex: none; }
  .ev .body { min-width: 0; flex: 1; }
  .ev .title { font-weight: 600; overflow-wrap: anywhere; }
  .ev .title a { color: inherit; text-decoration: none; } .ev .title a:hover { text-decoration: underline; }
  .tag { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
  .t-new_product { color: var(--blue); } .t-restock, .t-page_match { color: var(--green); } .t-price_change { color: var(--yellow); }
  .t-sold_out { color: var(--red); } .t-page_change { color: var(--pink); } .t-error { color: var(--muted); }
  .empty { padding: 28px 16px; color: var(--muted); text-align: center; }
  .settings { display: flex; gap: 10px; padding: 16px; flex-wrap: wrap; align-items: flex-end; }
  .settings label { flex: 1 1 260px; }
  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--panel2); border: 1px solid var(--border); padding: 10px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100vw - 40px); }
  .toast.show { opacity: 1; } .toast.err { border-color: var(--red); }
  @media (max-width: 600px) { th:nth-child(3), td:nth-child(3) { display: none; } th, td { padding: 10px 12px; } .row-actions { flex-direction: column; align-items: stretch; } }
  .left { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
  .page-only { display: none; } form.page .page-only { display: flex; } form.page .shopify-only { display: none; }
</style>
</head>
<body>
<header>
  <h1>Drop<span>Monitor</span></h1>
  <div class="stats">
    <div><span id="conn" class="dot"></span><span id="connText">Offline</span></div>
    <div>Monitors <b id="statMonitors">0</b></div>
    <div>Active <b id="statActive">0</b></div>
    <div>Alerts <b id="statAlerts">0</b></div>
  </div>
</header>

<main>
  <div class="left">
    <section>
      <h2><span class="grow" id="formTitle">Add monitor</span></h2>
      <form id="form">
        <label>Type
          <select name="kind">
            <option value="shopify">Shopify store</option>
            <option value="page">Any page (keyword)</option>
          </select>
        </label>
        <label>Name <input name="name" placeholder="Kith new arrivals"></label>
        <label class="wide">URL <input name="url" required placeholder="https://store.com or https://store.com/collections/footwear"></label>
        <label class="shopify-only">Include keywords <input name="include" placeholder="dunk, jordan"></label>
        <label class="shopify-only">Exclude keywords <input name="exclude" placeholder="kids, toddler"></label>
        <label class="page-only">Keyword <input name="keyword" placeholder="Add to cart"></label>
        <label class="page-only">Alert when
          <select name="pageMode">
            <option value="appears">keyword appears</option>
            <option value="disappears">keyword disappears</option>
            <option value="changes">page changes</option>
          </select>
        </label>
        <label>Interval (sec, min 30) <input name="intervalSec" type="number" min="30" value="60"></label>
        <label class="wide">Webhook override (optional) <input name="webhookUrl" placeholder="https://discord.com/api/webhooks/…"></label>
        <div class="wide row-actions">
          <button type="button" id="cancelEdit" hidden>Cancel</button>
          <button class="primary" type="submit" id="submitBtn">Add monitor</button>
        </div>
      </form>
    </section>

    <section>
      <h2><span class="grow">Monitors</span></h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Monitor</th><th>Status</th><th>Last check</th><th></th></tr></thead>
          <tbody id="monitors"></tbody>
        </table>
      </div>
      <div id="noMonitors" class="empty">No monitors yet. Add a Shopify store above to get started.</div>
    </section>

    <section>
      <h2><span class="grow">Discord webhook</span></h2>
      <div class="settings">
        <label>Default webhook URL <input id="webhook" placeholder="https://discord.com/api/webhooks/…"></label>
        <button id="saveWebhook">Save</button>
        <button id="testWebhook">Send test</button>
      </div>
    </section>
  </div>

  <section>
    <h2><span class="grow">Live feed</span><button class="small" id="clearFeed">Clear view</button></h2>
    <div class="feed" id="feed"><div class="empty">Waiting for alerts…</div></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
const $ = (sel) => document.querySelector(sel);
const LABELS = { new_product: 'New product', restock: 'Restock', price_change: 'Price change', sold_out: 'Sold out', page_match: 'Keyword alert', page_change: 'Page changed', error: 'Error' };
let monitors = [];
let editingId = null;
let alertCount = 0;

function el(tag, props = {}, children = []) {
  const node = Object.assign(document.createElement(tag), props);
  for (const c of [].concat(children)) node.append(c);
  return node;
}

function toast(msg, isError = false) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' err' : '');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => (t.className = 'toast'), 3000);
}

async function api(path, opts = {}) {
  const res = await fetch('/api' + path, {
    ...opts,
    headers: opts.body ? { 'content-type': 'application/json' } : {},
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (res.status === 204) return null;
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

function ago(iso) {
  if (!iso) return '—';
  const s = Math.round((Date.now() - new Date(iso)) / 1000);
  if (s < 0) return 'in ' + (-s) + 's';
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.round(s / 60) + 'm ago';
  return Math.round(s / 3600) + 'h ago';
}

function safeHref(url) {
  try { const u = new URL(url); return u.protocol === 'https:' || u.protocol === 'http:' ? u.href : null; } catch { return null; }
}

function statusPill(m) {
  const s = m.status || {};
  if (!m.enabled) return el('span', { className: 'pill off', textContent: 'Paused' });
  if (s.running) return el('span', { className: 'pill run', textContent: 'Checking…' });
  if (s.lastError) return el('span', { className: 'pill err', textContent: 'Error', title: s.lastError });
  if (s.lastCheck) return el('span', { className: 'pill ok', textContent: 'Watching' });
  return el('span', { className: 'pill off', textContent: 'Starting' });
}

function renderMonitors() {
  const body = $('#monitors');
  body.replaceChildren(...monitors.map((m) => {
    const filters = m.kind === 'shopify'
      ? [m.include.length ? '+' + m.include.join(', +') : '', m.exclude.length ? '-' + m.exclude.join(', -') : ''].filter(Boolean).join('  ')
      : `${m.pageMode}${m.keyword ? ': "' + m.keyword + '"' : ''}`;
    const actions = el('div', { className: 'row-actions' }, [
      el('button', { className: 'small', textContent: 'Run now', onclick: () => api(`/monitors/${m.id}/run`, { method: 'POST' }).catch((e) => toast(e.message, true)) }),
      el('button', { className: 'small', textContent: m.enabled ? 'Pause' : 'Start', onclick: () => update(m.id, { enabled: !m.enabled }) }),
      el('button', { className: 'small', textContent: 'Edit', onclick: () => startEdit(m) }),
      el('button', { className: 'small danger', textContent: 'Delete', onclick: () => remove(m) }),
    ]);
    return el('tr', {}, [
      el('td', {}, [
        el('div', { textContent: m.name }),
        el('div', { className: 'sub', textContent: `${m.kind === 'shopify' ? 'Shopify' : 'Page'} · every ${m.intervalSec}s · ${m.url}` }),
        filters ? el('div', { className: 'sub', textContent: filters }) : '',
      ]),
      el('td', {}, statusPill(m)),
      el('td', { className: 'sub', textContent: ago(m.status?.lastCheck), title: m.status?.lastError || '' }),
      el('td', {}, actions),
    ]);
  }));
  $('#noMonitors').hidden = monitors.length > 0;
  $('#statMonitors').textContent = monitors.length;
  $('#statActive').textContent = monitors.filter((m) => m.enabled).length;
}

function renderEvent(e) {
  const href = safeHref(e.url);
  const img = safeHref(e.image);
  return el('div', { className: 'ev' }, [
    img ? el('img', { src: img, alt: '', loading: 'lazy' }) : '',
    el('div', { className: 'body' }, [
      el('div', { className: `tag t-${e.type}`, textContent: LABELS[e.type] || e.type }),
      el('div', { className: 'title' }, href ? el('a', { href, target: '_blank', rel: 'noopener noreferrer', textContent: e.title }) : e.title),
      ...e.details.map((d) => el('div', { className: 'sub', textContent: d })),
      el('div', { className: 'sub', textContent: `${e.monitorName} · ${new Date(e.at).toLocaleTimeString()}` }),
    ]),
  ]);
}

function addEvents(events, prepend) {
  const feed = $('#feed');
  if (feed.querySelector('.empty')) feed.replaceChildren();
  const nodes = events.map(renderEvent);
  prepend ? feed.prepend(...nodes) : feed.append(...nodes);
  while (feed.children.length > 300) feed.lastChild.remove();
  alertCount += events.filter((e) => e.type !== 'error').length;
  $('#statAlerts').textContent = alertCount;
}

function formData() {
  const f = new FormData($('#form'));
  const data = Object.fromEntries(f.entries());
  data.intervalSec = Number(data.intervalSec);
  return data;
}

function resetForm() {
  editingId = null;
  $('#form').reset();
  $('#form').className = '';
  $('#formTitle').textContent = 'Add monitor';
  $('#submitBtn').textContent = 'Add monitor';
  $('#cancelEdit').hidden = true;
}

function startEdit(m) {
  editingId = m.id;
  const form = $('#form');
  for (const [k, v] of Object.entries(m)) {
    if (form.elements[k]) form.elements[k].value = Array.isArray(v) ? v.join(', ') : (v ?? '');
  }
  form.className = m.kind === 'page' ? 'page' : '';
  $('#formTitle').textContent = 'Edit monitor';
  $('#submitBtn').textContent = 'Save changes';
  $('#cancelEdit').hidden = false;
  form.scrollIntoView({ behavior: 'smooth' });
}

async function update(id, patch) {
  try {
    const m = await api(`/monitors/${id}`, { method: 'PATCH', body: patch });
    monitors = monitors.map((x) => (x.id === id ? m : x));
    renderMonitors();
    return m;
  } catch (e) { toast(e.message, true); }
}

async function remove(m) {
  if (!confirm(`Delete "${m.name}"?`)) return;
  try {
    await api(`/monitors/${m.id}`, { method: 'DELETE' });
    monitors = monitors.filter((x) => x.id !== m.id);
    renderMonitors();
  } catch (e) { toast(e.message, true); }
}

$('#form').kind.addEventListener('change', (e) => { $('#form').className = e.target.value === 'page' ? 'page' : ''; });
$('#cancelEdit').addEventListener('click', resetForm);
$('#form').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    if (editingId) {
      if (await update(editingId, formData())) { toast('Monitor updated'); resetForm(); }
    } else {
      const m = await api('/monitors', { method: 'POST', body: formData() });
      monitors.push(m);
      renderMonitors();
      toast('Monitor added. First check builds a baseline.');
      resetForm();
    }
  } catch (err) { toast(err.message, true); }
});

$('#saveWebhook').addEventListener('click', async () => {
  try {
    const s = await api('/settings', { method: 'PUT', body: { webhookUrl: $('#webhook').value.trim() } });
    $('#webhook').value = s.webhookUrl || '';
    toast(s.webhookUrl ? 'Webhook saved' : 'Webhook cleared');
  } catch (e) { toast(e.message, true); }
});
$('#testWebhook').addEventListener('click', () =>
  api('/test-webhook', { method: 'POST', body: {} }).then(() => toast('Test sent to Discord'), (e) => toast(e.message, true)));
$('#clearFeed').addEventListener('click', () => { $('#feed').replaceChildren(el('div', { className: 'empty', textContent: 'Waiting for alerts…' })); });

function connect() {
  const es = new EventSource('/api/stream');
  es.onopen = () => { $('#conn').className = 'dot on'; $('#connText').textContent = 'Live'; };
  es.onerror = () => { $('#conn').className = 'dot'; $('#connText').textContent = 'Reconnecting'; };
  es.addEventListener('monitor-event', (msg) => addEvents([JSON.parse(msg.data)], true));
  es.addEventListener('status', (msg) => {
    const { id, status } = JSON.parse(msg.data);
    const m = monitors.find((x) => x.id === id);
    if (m) { m.status = status; renderMonitors(); }
  });
}

(async () => {
  try {
    const [ms, events, settings] = await Promise.all([api('/monitors'), api('/events'), api('/settings')]);
    monitors = ms;
    renderMonitors();
    if (events.length) addEvents(events.slice(0, 100), false);
    $('#webhook').value = settings.webhookUrl || '';
  } catch (e) { toast(e.message, true); }
  connect();
  setInterval(renderMonitors, 5000); // keep "x ago" fresh
})();
</script>
</body>
</html>
